openapi: 3.0.0
info:
  version: "1.0.0"
  title: API социальной сети для путешественников
  description: Домашнее задания по курсу - [System Design](https://balun.courses/courses/system_design)

externalDocs:
  description: Проект на GitHub
  url: https://github.com/normalisht/social_network_system_design

tags:
  - name: Посты
  - name: Пользователи
  - name: Загрузки

paths:
  /files:
    post:
      summary: Загрузить файл
      tags:
        - Загрузки
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "201":
          description: Файлы загружены
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        url:
                          type: string
                          format: uri
        "400":
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /posts:
    get:
      summary: Получить список постов
      tags:
        - Посты
      parameters:
        - $ref: '#/components/parameters/AuthorId'
        - $ref: '#/components/parameters/PlaceId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        "200":
          description: Список постов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostList'
    post:
      summary: Создать пост
      tags:
        - Посты
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                place_id:
                  type: string
                  format: uuid
                file_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        "201":
          description: Пост создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
        "400":
          description: Неверные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /posts/{id}:
    get:
      summary: Получить пост по id
      tags:
        - Посты
      parameters:
        - $ref: '#/components/parameters/UUID'
      responses:
        "200":
          description: Пост
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  title:
                    type: string
                  description:
                    type: string
                  place:
                    $ref: '#/components/schemas/Place'
                  author:
                    $ref: '#/components/schemas/User'
                  images:
                    type: array
                    items:
                      type: string
                  comment_counter:
                    type: integer
                  reaction_counter:
                    type: integer
        "404":
          description: Пост не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /posts/{id}/comments:
    get:
      summary: Получить комментарии к посту
      tags:
        - Посты
      parameters:
        - $ref: '#/components/parameters/UUID'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        "200":
          description: Список комментариев к посту
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentList'
        "404":
          description: Пост не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Добавить комментарий к посту
      tags:
        - Посты
      parameters:
        - $ref: '#/components/parameters/UUID'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
      responses:
        "201":
          description: Комментарий добавлен
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
        "400":
          description: Неверные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Пост не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /posts/{id}/reactions:
    post:
      summary: Добавить реакцию к посту
      tags:
        - Посты
      parameters:
        - $ref: '#/components/parameters/UUID'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reaction:
                  type: boolean
                  description: true - лайк, false - дизлайк
      responses:
        "201":
          description: Реакция добавлена
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
        "400":
          description: Неверные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Пост не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users/{id}:
    get:
      summary: Получить пользователя по id
      tags:
        - Пользователи
      parameters:
        - $ref: '#/components/parameters/UUID'
      responses:
        "200":
          description: Пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        "404":
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users/{id}/subscriptions:
    post:
      summary: Подписаться на пользователя
      tags:
        - Пользователи
      parameters:
        - $ref: '#/components/parameters/UUID'
      responses:
        "201":
          description: Подписка оформлена
        "404":
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Отписаться от пользователя
      tags:
        - Пользователи
      parameters:
        - $ref: '#/components/parameters/UUID'
      responses:
        "204":
          description: Подписка отменена
  /users/{id}/feed:
    get:
      summary: Получить ленту постов пользователя
      parameters:
        - $ref: '#/components/parameters/PlaceId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      tags:
        - Пользователи
      responses:
        "200":
          description: Лента постов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostList'
        "404":
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  parameters:
    UUID:
      in: path
      name: id
      required: true
      description: UUID
      schema:
        type: string
        format: uuid
    AuthorId:
      in: query
      name: author_id
      required: false
      description: Фильтр по автору
      schema:
        type: string
        format: uuid
    PlaceId:
      in: query
      name: place_id
      required: false
      description: Фильтр по месту
      schema:
        type: string
        format: uuid
    Limit:
      in: query
      name: limit
      required: false
      description: Количество элементов на странице
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      in: query
      name: offset
      required: false
      description: Смещение для пагинации
      schema:
        type: integer
        minimum: 0
        default: 0
  schemas:
    Pagination:
      type: object
      properties:
        total:
          type: integer
          description: Общее количество постов
        has_next:
          type: boolean
          description: есть ли следующая страница
        has_prev:
          type: boolean
          description: есть ли предыдущая страница
    User:
      type: object
      description: Пользователь
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    Place:
      type: object
      description: Место путешествия
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        coordinates:
          type: string
    PostList:
      description: Список постов с пагинацией
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              title:
                type: string
              preview_image:
                type: string
                format: uri
              author:
                $ref: '#/components/schemas/User'
        pagination:
          $ref: '#/components/schemas/Pagination'
    CommentList:
      description: Список комментариев с пагинацией
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              author:
                $ref: '#/components/schemas/User'
              message:
                type: string
              create_at:
                type: string
                format: date-time
        pagination:
          $ref: '#/components/schemas/Pagination'
    Error:
      type: object
      properties:
        error_code:
          type: integer
          description: Код ошибки
        message:
          type: string
          description: Описание ошибки
